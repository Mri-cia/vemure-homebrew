<style>
    .grid {
        display: grid;

        display:grid;
        grid-template-columns: repeat(3, 1fr);
        justify-items: center;
        border: 1px solid rgb(var(--secondary-color) / 0.5);
    }

    nav div {
        width: 100%;
        padding: 0.5em 0;
        text-align: center;
        font-weight: bold;
    }

    nav div:hover {
        cursor: pointer;
        background-color: rgb(var(--accent-color) / 0.3);
        transition: 0.3s;
    }

    nav div.active {
        background-color: rgb(var(--accent-color));
        color: rgb(var(--primary-color));
    }
</style>
