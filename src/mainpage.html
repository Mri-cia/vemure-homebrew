  <style>
    .head-container{
        margin: 0 2em;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 120px);
    }

    .main-container {
      padding: 0 2em;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 3em;
      height: 100%;
    }

    .card-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 240px;
      height: 120px;
    }

    @media (max-width: 1030px) {
      .main-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .card-wrap {
        width: 280px;
        height: 160px;
      }
    }
  </style>
