<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weapon Creation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 120px);
    }
    
    .button-group {
        grid-column: 2;
        display: flex;
        padding: 1em 0;
        justify-content: end;
        gap: 1em;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 8px 1em;
    }
  </style>
  <body>
    <header class="bot-seperation-line">
      <div class="head-container">
        <a class="logo" href="mainpage.html">Vemure Homebrew</a>
      </div>
    </header>
    <main>
      <div class="card-wrap">
        <form class="card-form">
          <h3>Creation</h3>
          <div class="form-grid">
              <label for="">Name</label>
              <input type="text" />

              <label for="">Damage</label>
              <input type="text" />

              <label for="">Parry</label>
              <input type="text" />

              <label for="">ST</label>
              <input type="text" />

              <label for="">Cost</label>
              <input type="text" />

              <label for="">Weight</label>
              <input type="text" />

              <label for="">Tl</label>
              <input type="text" />

              <label for="">Description</label>
              <textarea name="" id=""></textarea>

              <div class="button-group">
                <button type="reset" class="delete-button">Reset</button>
                <button type="submit" class="submit-button">Submit</button>
              </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
